[package]
name = "tmux-tabs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Background daemon for tmux-tabs that tracks tmux sessions and git state."

[[bin]]
name = "tmux-tabs-server"
path = "src/main.rs"

[dependencies]
tmux-tabs-common = { path = "../common" }
anyhow = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "macros", "signal", "time", "process", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]`, so the Copilot
# tail loop can be driven across simulated minutes of silence instantly.
tokio = { workspace = true, features = ["test-util"] }
