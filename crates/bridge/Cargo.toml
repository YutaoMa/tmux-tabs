[package]
name = "tmux-tabs-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Chrome native messaging bridge for tmux-tabs."

[[bin]]
name = "tmux-tabs-bridge"
path = "src/main.rs"

[dependencies]
tmux-tabs-common = { path = "../common" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "sync", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
