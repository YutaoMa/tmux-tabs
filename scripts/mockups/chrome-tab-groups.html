<!DOCTYPE html>
<!--
  Illustration of the Chrome tab strip while tmux-tabs is driving it.

  Chrome ignores --load-extension on recent builds, so the real tab strip can't
  be captured headlessly. This mock-up mirrors what background.js actually does:
  one group per tmux session, always created with color "grey", the current
  session's group expanded and every other group collapsed.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --frame: #202124;
      --toolbar: #35363A;
      --tab-active: #35363A;
      --text: #E8EAED;
      --text-dim: #9AA0A6;
      /* Chrome's "grey" tab group, dark theme. */
      --group: #DADCE0;
      --group-tint: rgba(154, 160, 166, 0.26);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 880px;
      font-family: system-ui, -apple-system, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .window {
      background: var(--frame);
      border-radius: 10px;
      overflow: hidden;
    }

    /* tab strip */
    .strip {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 10px 10px 0;
      height: 50px;
    }

    .lights { display: flex; gap: 8px; padding: 0 10px 10px 2px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .lights i:nth-child(1) { background: #FF5F57; }
    .lights i:nth-child(2) { background: #FEBC2E; }
    .lights i:nth-child(3) { background: #28C840; }

    /* A collapsed group is just its title pill. */
    .chip {
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      background: var(--group-tint);
      color: var(--group);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* An expanded group wraps its title pill and its tabs. */
    .group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      margin-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: var(--group-tint);
    }
    .group .chip { margin-bottom: 0; background: rgba(154, 160, 166, 0.28); }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 190px;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .tab.active { background: var(--tab-active); color: var(--text); }

    .favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex: none;
    }
    .title { overflow: hidden; text-overflow: ellipsis; }

    .plus {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
      color: var(--text-dim);
      font-size: 18px;
      font-weight: 300;
    }

    /* toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 48px;
      padding: 0 14px;
      background: var(--toolbar);
    }
    .nav { display: flex; gap: 16px; color: var(--text-dim); font-size: 15px; }
    .omnibox {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      background: #202124;
      color: var(--text-dim);
      font-size: 12px;
    }
    .omnibox b { color: var(--text); font-weight: 400; }
    .ext {
      width: 18px;
      height: 18px;
      flex: none;
      color: rgba(232, 234, 237, 0.7);
    }
    .lock { width: 13px; height: 13px; flex: none; opacity: .8; }
  </style>
</head>
<body>
  <div class="window">
    <div class="strip">
      <div class="lights"><i></i><i></i><i></i></div>

      <!-- Collapsed: a tmux session that isn't the current one. -->
      <div class="chip">api-gateway</div>
      <div class="chip">tonic</div>

      <!-- Expanded: the attached tmux session. -->
      <div class="group">
        <div class="chip">tmux-tabs</div>
        <div class="tab active">
          <span class="favicon" style="background:#DE6B33"></span>
          <span class="title">ratatui &mdash; Rust</span>
        </div>
        <div class="tab">
          <span class="favicon" style="background:#8B949E"></span>
          <span class="title">YutaoMa/tmux-tabs</span>
        </div>
      </div>

      <div class="plus">+</div>
    </div>

    <div class="toolbar">
      <div class="nav"><span>&#8592;</span><span>&#8594;</span><span>&#10227;</span></div>
      <div class="omnibox">
        <svg class="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
        </svg>
        <span>docs.rs<b>/ratatui/latest/ratatui/widgets</b></span>
      </div>
      <svg class="ext" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/>
      </svg>
    </div>
  </div>
</body>
</html>
