<!DOCTYPE html>
<!--
  Illustration of the sidebar and the Chrome tab strip staying in sync.

  Chrome ignores --load-extension on recent builds, so the real tab strip can't
  be captured headlessly. This mock-up mirrors what background.js actually does:
  one group per tmux session, always created with color "grey", the current
  session's group expanded and every other group collapsed.

  The sidebar on the left is not drawn here: it is an SVG the screenshot
  generator renders from the real widgets (parts/sidebar-<session>.svg), so both
  halves of the picture always agree with the code.

  The scene is rebuilt for the session named in the URL hash (e.g. #tonic), so
  gen-screenshots.sh can render one frame per switch and stitch them into an
  animation. With no hash it renders the still.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --frame: #202124;
      --toolbar: #35363A;
      --tab-active: #35363A;
      --text: #E8EAED;
      --text-dim: #9AA0A6;
      /* Chrome's "grey" tab group, dark theme. */
      --group: #DADCE0;
      --group-tint: rgba(154, 160, 166, 0.26);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 1100px;
      font-family: system-ui, -apple-system, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      display: flex;
      align-items: center;
      padding: 16px;
    }

    .sidebar { width: 244px; height: 434px; flex: none; }

    /* The double-headed arrow that ties the two windows together. */
    .link {
      width: 104px;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
    }
    .link svg { width: 84px; height: 16px; }
    .link span {
      font-size: 13px;
      letter-spacing: .04em;
    }

    .window {
      width: 720px;
      flex: none;
      background: var(--frame);
      border-radius: 10px;
      overflow: hidden;
    }

    /* tab strip */
    .strip {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 10px 10px 0;
      height: 50px;
    }

    .lights { display: flex; gap: 8px; padding: 0 10px 10px 2px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .lights i:nth-child(1) { background: #FF5F57; }
    .lights i:nth-child(2) { background: #FEBC2E; }
    .lights i:nth-child(3) { background: #28C840; }

    /* A collapsed group is just its title pill. */
    .groups { display: flex; align-items: flex-end; gap: 6px; }
    .chip {
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      background: var(--group-tint);
      color: var(--group);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* An expanded group wraps its title pill and its tabs. */
    .group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      margin-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: var(--group-tint);
    }
    .group .chip { margin-bottom: 0; background: rgba(154, 160, 166, 0.28); }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 152px;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .tab.active { background: var(--tab-active); color: var(--text); }

    .favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex: none;
    }
    .title { overflow: hidden; text-overflow: ellipsis; }

    .plus {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
      color: var(--text-dim);
      font-size: 18px;
      font-weight: 300;
    }

    /* toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 48px;
      padding: 0 14px;
      background: var(--toolbar);
    }
    .nav { display: flex; gap: 16px; color: var(--text-dim); font-size: 15px; }
    .omnibox {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      background: #202124;
      color: var(--text-dim);
      font-size: 12px;
    }
    .omnibox b { color: var(--text); font-weight: 400; }
    .ext {
      width: 18px;
      height: 18px;
      flex: none;
      color: rgba(232, 234, 237, 0.7);
    }
    .lock { width: 13px; height: 13px; flex: none; opacity: .8; }

    /* Stand-in for the page itself: the tab title, then blocked-out text. */
    .page {
      height: 214px;
      padding: 22px 26px;
      background: #FFFFFF;
    }
    .page h1 {
      margin: 0 0 20px;
      color: #202124;
      font-size: 17px;
      font-weight: 600;
    }
    .page i {
      display: block;
      height: 10px;
      margin-bottom: 12px;
      border-radius: 5px;
      background: #E8EAED;
    }
    .page .code {
      height: 74px;
      margin-top: 20px;
      border-radius: 8px;
      background: #F1F3F4;
    }
  </style>
</head>
<body>
  <div class="scene">
    <img class="sidebar" alt="">

    <div class="link">
      <svg viewBox="0 0 84 16" fill="none" aria-hidden="true">
        <defs>
          <marker id="head" markerWidth="6" markerHeight="6" refX="5.2" refY="3"
                  orient="auto-start-reverse" markerUnits="strokeWidth">
            <path d="M0 0 L6 3 L0 6 z" fill="currentColor"/>
          </marker>
        </defs>
        <line x1="7" y1="8" x2="77" y2="8" stroke="currentColor" stroke-width="2"
              marker-start="url(#head)" marker-end="url(#head)"/>
      </svg>
      <span>in sync</span>
    </div>

    <div class="window">
      <div class="strip">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="groups"></div>
        <div class="plus">+</div>
      </div>

      <div class="toolbar">
        <div class="nav"><span>&#8592;</span><span>&#8594;</span><span>&#10227;</span></div>
        <div class="omnibox">
          <svg class="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
          </svg>
          <span class="url"></span>
        </div>
        <svg class="ext" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/>
        </svg>
      </div>

      <div class="page">
        <h1></h1>
        <i style="width: 86%"></i>
        <i style="width: 94%"></i>
        <i style="width: 62%"></i>
        <div class="code"></div>
      </div>
    </div>
  </div>

  <script>
    // One entry per tmux session, in tab-strip order. Each session's group
    // holds the tabs that were opened while working in it. Kept in step with
    // BROWSER_SESSIONS in crates/client/src/screenshot.rs.
    const SESSIONS = [
      {
        name: "api-gateway",
        host: "docs.rs",
        path: "/governor/latest/governor/struct.RateLimiter.html",
        tabs: [
          { title: "governor — Rust", favicon: "#DE6B33" },
          { title: "Token bucket — Wikipedia", favicon: "#B0B4B8" },
        ],
      },
      {
        name: "tmux-tabs",
        host: "docs.rs",
        path: "/ratatui/latest/ratatui/widgets",
        tabs: [
          { title: "ratatui — Rust", favicon: "#DE6B33" },
          { title: "YutaoMa/tmux-tabs", favicon: "#8B949E" },
        ],
      },
      {
        name: "tonic",
        host: "github.com",
        path: "/hyperium/tonic/pull/2210",
        tabs: [
          { title: "xds routing #2210", favicon: "#8B949E" },
          { title: "tonic — Rust", favicon: "#DE6B33" },
        ],
      },
    ];

    function render(currentName) {
      const current = SESSIONS.find((s) => s.name === currentName) || SESSIONS[1];
      const strip = document.querySelector(".groups");
      strip.replaceChildren();

      for (const session of SESSIONS) {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = session.name;

        // Collapsed groups are just their title pill; only the current
        // session's group shows its tabs.
        if (session !== current) {
          strip.append(chip);
          continue;
        }
        const group = document.createElement("div");
        group.className = "group";
        group.append(chip);
        session.tabs.forEach((tab, index) => {
          const el = document.createElement("div");
          el.className = index === 0 ? "tab active" : "tab";
          el.innerHTML =
            '<span class="favicon"></span><span class="title"></span>';
          el.querySelector(".favicon").style.background = tab.favicon;
          el.querySelector(".title").textContent = tab.title;
          group.append(el);
        });
        strip.append(group);
      }

      document.querySelector(".url").replaceChildren(
        current.host,
        Object.assign(document.createElement("b"), { textContent: current.path }),
      );
      document.querySelector(".page h1").textContent = current.tabs[0].title;
      // Rendered next to the mock-up by gen-screenshots.sh.
      document.querySelector(".sidebar").src = `sidebar-${current.name}.svg`;
    }

    render(decodeURIComponent(location.hash.slice(1)));
  </script>
</body>
</html>
